<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<link rel="stylesheet" href="windowChrome.css">
<style>
/* Hydra palette: dark #0A121F (windowChrome.css) with teal #12C9A5 accents. */
body {
  color: #E6EEF2;
  -webkit-user-select: none;
  user-select: none;
}
.icon {
  margin-bottom: 20px;
}
.name {
  font-size: 22px;
  font-weight: 600;
  color: #F2F7F9;
  margin-bottom: 4px;
}
.version {
  font-size: 13px;
  color: #12C9A5;
  margin-bottom: 16px;
}
.description {
  font-size: 13px;
  color: #9FB0BA;
  text-align: center;
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 20px;
}
.copyright {
  font-size: 11px;
  color: #7D8C96;
  margin-bottom: 4px;
}
.credit {
  font-size: 11px;
  color: #7D8C96;
}
.copyright a,
.credit a {
  color: #12C9A5;
  text-decoration: none;
  cursor: pointer;
}
.copyright a:hover,
.credit a:hover,
.copyright a:focus-visible,
.credit a:focus-visible {
  text-decoration: underline;
}
.close-btn {
  margin-top: 20px;
  padding: 6px 24px;
  font-size: 13px;
  font-family: inherit;
  color: #E6EEF2;
  background: rgba(18, 201, 165, 0.10);
  border: 1px solid rgba(18, 201, 165, 0.35);
  border-radius: 6px;
  cursor: pointer;
}
.close-btn:hover {
  background: rgba(18, 201, 165, 0.18);
}
</style>
</head>
<body>
<img class="icon" id="icon" src="hydra-logo.png" alt="Hydra">
<div class="name" id="name">Hydra</div>
<div class="version" id="version"></div>
<div class="description" id="description"></div>
<div class="copyright" id="copyright"></div>
<div class="credit" id="credit"></div>
<button class="close-btn" id="close-btn"></button>
<script>
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') || 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = /^(ar|he)(-|$)/i.test(lang) ? 'rtl' : 'ltr';
  var name = params.get('name') || 'Hydra';
  var version = params.get('version') || '';
  var description = params.get('description') || '';
  var copyright = params.get('copyright') || '';
  var author = params.get('author') || '';
  var authorUrl = params.get('authorUrl') || '';
  var credit = params.get('credit') || '';
  var originalAuthor = params.get('originalAuthor') || '';
  var originalAuthorUrl = params.get('originalAuthorUrl') || '';
  var license = params.get('license') || '';
  var aboutText = params.get('about') || 'About ' + name;
  var closeText = params.get('close') || 'Close';
  var versionPrefix = params.get('versionPrefix') || 'Version';

  document.title = aboutText;

  document.getElementById('name').textContent = name;
  document.getElementById('icon').alt = name;
  document.getElementById('version').textContent = versionPrefix + ' ' + version;
  document.getElementById('description').textContent = description;
  /**
   * A link to a GitHub profile, or plain text for any other address. The main
   * process opens it in the system browser and refuses anything off github.com.
   * @param {string} text - Link text
   * @param {string} url - Profile URL
   * @returns {Node}
   */
  function profileLink(text, url) {
    if (url.indexOf('https://github.com/') !== 0) return document.createTextNode(text);
    var link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = text;
    return link;
  }

  /**
   * Fill a line from text and node parts, without parsing any HTML.
   * @param {string} id - Element id
   * @param {Array<string | Node>} parts - Text or nodes, in order
   * @returns {void}
   */
  function fillLine(id, parts) {
    var line = document.getElementById(id);
    parts.forEach(function (part) {
      line.appendChild(typeof part === 'string' ? document.createTextNode(part) : part);
    });
  }

  fillLine('copyright', [copyright + ' ', profileLink(author, authorUrl)]);
  fillLine('credit', [credit + ' ', profileLink(originalAuthor, originalAuthorUrl), ' \u00B7 ' + license]);
  document.getElementById('close-btn').textContent = closeText;
  document.querySelector('.close-btn').addEventListener('click', function() { window.close(); });
</script>
</body>
</html>
