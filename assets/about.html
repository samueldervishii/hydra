<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<link rel="stylesheet" href="windowChrome.css">
<style>
/* Hydra palette: dark #0A121F (windowChrome.css) with teal #12C9A5 accents. */
body {
  color: #E6EEF2;
  -webkit-user-select: none;
  user-select: none;
}
.icon {
  margin-bottom: 20px;
}
.name {
  font-size: 22px;
  font-weight: 600;
  color: #F2F7F9;
  margin-bottom: 4px;
}
.version {
  font-size: 13px;
  color: #12C9A5;
  margin-bottom: 16px;
}
.description {
  font-size: 13px;
  color: #9FB0BA;
  text-align: center;
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 20px;
}
.copyright {
  font-size: 11px;
  color: #7D8C96;
  margin-bottom: 4px;
}
.credit {
  font-size: 11px;
  color: #7D8C96;
}
.copyright a,
.credit a {
  color: #12C9A5;
  text-decoration: none;
  cursor: pointer;
}
.copyright a:hover,
.credit a:hover,
.copyright a:focus-visible,
.credit a:focus-visible {
  text-decoration: underline;
}
.close-btn {
  margin-top: 20px;
  padding: 6px 24px;
  font-size: 13px;
  font-family: inherit;
  color: #E6EEF2;
  background: rgba(18, 201, 165, 0.10);
  border: 1px solid rgba(18, 201, 165, 0.35);
  border-radius: 6px;
  cursor: pointer;
}
.close-btn:hover {
  background: rgba(18, 201, 165, 0.18);
}
</style>
</head>
<body>
<img class="icon" id="icon" src="hydra-logo.png" alt="Hydra">
<div class="name" id="name">Hydra</div>
<div class="version" id="version"></div>
<div class="description" id="description"></div>
<div class="copyright" id="copyright"></div>
<div class="credit" id="credit"></div>
<button class="close-btn" id="close-btn"></button>
<script src="about.js"></script>
</body>
</html>
