name: Release (Linux)

# Releases this fork whenever main carries a version that has not been
# released. Only a push to main that changes package.json starts it: there is
# no manual trigger, and every job also checks github.ref, so no other branch,
# tag, fork or pull request can run it. "check" reads package.json's version
# and stops there when a tag or a GitHub release with that exact name already
# exists. Otherwise "build" makes the Linux amd64 .deb with no secret and a
# read-only token, and "publish", in the Release environment, turns it into a
# flat apt repository signed with that environment's HYDRA_GPG_PRIVATE_KEY,
# tags the pushed commit with an annotated <version> tag and publishes the
# .deb, SHA256SUMS, the repository files and the public key. Every release is
# marked Latest, because apt reads the repository from releases/latest/download/.
# Last, "apt" calls .github/workflows/apt-r2.yml to publish the same release
# to the apt repository at https://apt.six9.uk, on Cloudflare R2.
# No EVS/VMP signing or other targets are involved. From 2.0.0 versions
# are plain MAJOR.MINOR.PATCH, and the check refuses anything else; the
# 1.1.2-hydra.N tags and releases from before stay as they are.

on:
  push:
    branches: [main]
    paths: ["package.json"]

# Read-only by default; only the publish job, which tags and creates the
# release, gets contents: write.
permissions:
  contents: read

# One release run at a time, never cancelled midway. A queued run starts after
# the one ahead of it has tagged, so its check sees the tag and stops. GitHub
# keeps only one pending run per group, though: a newer push cancels the run
# still waiting, so two version bumps pushed while a release is in progress
# release only the later one. Push one version bump at a time.
concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare package.json with existing tags and releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main, not ${GITHUB_REF}." >&2
            exit 1
          fi
          VERSION=$(jq -r .version package.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '${VERSION}' is not a plain MAJOR.MINOR.PATCH version." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # 200 means it exists and 404 means it does not. Anything else is an
          # API failure, which stops the run rather than guessing.
          http_status() {
            gh api -i "$1" 2>/dev/null | awk 'NR == 1 { print $2; exit }' || true
          }
          release=true
          for kind in tag release; do
            if [[ "$kind" == tag ]]; then
              status=$(http_status "repos/${GH_REPO}/git/ref/tags/${VERSION}")
            else
              status=$(http_status "repos/${GH_REPO}/releases/tags/${VERSION}")
            fi
            case "$status" in
              200) echo "A ${kind} named ${VERSION} already exists, so there is nothing to release."; release=false ;;
              404) ;;
              *) echo "::error::Could not check for an existing ${kind} (HTTP status '${status}')." >&2; exit 1 ;;
            esac
          done
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          [[ "$release" == true ]] && echo "Releasing ${VERSION} from ${GITHUB_SHA}."
          exit 0

  # Builds the .deb from the pushed commit. npm ci runs every dependency's
  # install scripts here, so this job holds no secret and no write token: a
  # process started by those scripts can outlive its step and read a later
  # step's environment, but only within this job.
  build:
    name: Build the .deb
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just
          just --version

      - name: Install dependencies
        run: npm ci

      # Vitest does not type-check, so a type error in test/ fails only the
      # second TypeScript program, which just lint runs and just build does not.
      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Build
        run: just build

      - name: Package the amd64 .deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Upload the .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 1

  # Signs and publishes. It runs in the Release environment, whose secret
  # HYDRA_GPG_PRIVATE_KEY is available to main only, and it runs no
  # third-party code: it checks out this commit for the signing script and
  # the public key, takes the .deb the build job made, and installs only
  # Ubuntu's apt-utils and gnupg.
  publish:
    name: Sign and publish the release
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb
          path: release

      - name: Install the apt repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          shopt -s nullglob
          debs=(*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "::error::Expected one .deb in release/, found ${#debs[@]}." >&2
            exit 1
          fi
          sha256sum "${debs[0]}" > SHA256SUMS
          cat SHA256SUMS

      # The secret reaches this step only. It is imported into a keyring that
      # lives for the step, and the key that signs is the one whose public half
      # users install: packaging/hydra.gpg. The script checks both signatures
      # against that file, so a mismatched secret fails here, before tagging.
      - name: Build and sign the apt repository
        env:
          HYDRA_GPG_PRIVATE_KEY: ${{ secrets.HYDRA_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$HYDRA_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key=$(gpg --with-colons --show-keys packaging/hydra.gpg | awk -F: '/^fpr/ {print $10; exit}')
          scripts/build-apt-repo.sh release "$key" packaging/hydra.gpg
          rm -rf "$GNUPGHOME"

      # The tag is created only after the build succeeded, and removed again if
      # the release cannot be published, so a failed run leaves nothing behind
      # and a re-run starts from a clean check.
      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_object=$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$VERSION" \
            -f message="Hydra ${VERSION}" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="$tag_object" > /dev/null
          echo "Tagged ${GITHUB_SHA} as ${VERSION}."
          # --latest: apt reads releases/latest/download/, so a release that is
          # not Latest would leave apt users on the previous one.
          if ! gh release create "$VERSION" release/*.deb release/SHA256SUMS \
            release/Packages release/Packages.gz release/Release \
            release/Release.gpg release/InRelease packaging/hydra.gpg \
            --verify-tag \
            --latest \
            --title "$VERSION" \
            --notes "Linux amd64 .deb built from ${GITHUB_SHA}. Verify the download with: sha256sum -c SHA256SUMS. Install through apt as described in the README."; then
            echo "::error::Publishing the release failed, so the ${VERSION} tag is being removed." >&2
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${VERSION}" || true
            exit 1
          fi

  # Publishes the release to the apt repository on R2. A release created with
  # the workflow's token starts no other workflow, so `on: release` in
  # apt-r2.yml would never fire; it is called here instead. Its job runs in
  # the Release environment and takes the R2 credentials and the signing key
  # from there, but a called workflow sees no secret its caller did not pass:
  # without `secrets: inherit` every one of them read as empty (2.7.1's apt
  # job), while the same workflow run by hand had them. The repository holds
  # no secrets of its own, so inherit hands on nothing but the environment's.
  apt:
    name: Publish to apt.six9.uk
    needs: [check, publish]
    if: github.ref == 'refs/heads/main' && needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/apt-r2.yml
    secrets: inherit
    with:
      tag: ${{ needs.check.outputs.version }}
